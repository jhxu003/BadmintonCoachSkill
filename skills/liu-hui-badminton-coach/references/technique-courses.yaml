schema_version: technique-course/v1
coach_id: liu-hui
systems:
  - system_id: liu-overhead-foundation
    title_zh: 后场头顶基础链
    title_en: Rear-court overhead foundation
    description_zh: 先建立到位、高位结构和完整释放，再区分高远球与杀球的速度和落点任务。
    principles:
      - 动作从到位和准备开始，不从挥拍末段开始模仿。
      - 高位窗口、持拍侧结构和随挥恢复必须放在同一次动作里看。
      - 先获得可重复的动作链，再增加速度、起跳和变化。
  - system_id: liu-overhead-variation
    title_zh: 后场头顶变化
    title_en: Rear-court overhead variation
    description_zh: 在基础头顶动作可用后，再训练滑板吊球的准备相似性、节奏变化和线路控制。
    principles:
      - 变化建立在基础头顶准备可用的前提上。
      - 用连续过程理解节奏，不把某张拍面定格当作完整技术。
      - 每一种变化都要连到结果观察和下一拍恢复。
  - system_id: liu-movement-recovery
    title_zh: 后场移动与恢复
    title_en: Rear-court movement and recovery
    description_zh: 以从中间准备、后场进入、动作窗口、落地和退出为一条路线，先确保下一拍可用。
    principles:
      - 后场移动不从腾空姿态开始，也不在落地时结束。
      - 路线要按来球、身体条件和下一拍要求调整，不固化唯一脚序。
  - system_id: liu-fast-exchange
    title_zh: 快速交换与双打连续性
    title_en: Fast exchange and doubles continuity
    description_zh: 用紧凑准备、短出拍和及时回收建立平抽挡与双打连续交换。
    principles:
      - 快速球先解决准备大小和可用间距，再谈更大力量。
      - 每次处理后都要回到下一拍和搭档可用的位置。
  - system_id: liu-backhand-transition
    title_zh: 反手被动过渡
    title_en: Passive backhand transition
    description_zh: 先用移动和身体朝向争取反手处理空间，再组织紧凑的过渡与恢复。
    principles:
      - 反手被动球不是只靠手腕的孤立动作。
      - 没有完整移动画面时，只教可见路线，不虚构球路结果。
  - system_id: liu-serve-opening
    title_zh: 发球与开局准备
    title_en: Serve and opening readiness
    description_zh: 用可重复的转拍、挥拍路线和下一拍准备组织发球开局，而不是只追求一张动作定格。
    principles:
      - 发球的挥拍路线和下一拍准备需要一起练习。
      - 徒手示范只能解释路线，不能替代过网高度或落点复测。
  - system_id: liu-match-transfer
    title_zh: 从练习到对抗
    title_en: Practice-to-rally transfer
    description_zh: 把单项动作带回有来球、线路和恢复要求的练习，再决定是否能迁移到对抗。
    principles:
      - 单次动作成功不等于对抗中已经稳定可用。
      - 每次进阶只改变一个条件，并保留可解释的复测指标。
