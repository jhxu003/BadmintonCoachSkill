        phase: preparation
        start_seconds: 577.50
        anchor_seconds: 577.70
        end_seconds: 577.90
        confidence: high
        framework_ids:
          - static-lock-racket-frame
        teaching_use: 先用完整画面确认来球、身体和球拍均可见，再进入启动阶段。
        teaching_points:
          - 观察来球下降过程，同时保留后续举拍空间。
          - 此帧只用于定位准备状态，不能单独代表整套动作。
