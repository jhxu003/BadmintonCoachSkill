        phase: contact_window
        start_seconds: 578.40
        anchor_seconds: 578.50
        end_seconds: 578.60
        confidence: medium
        framework_ids:
          - static-lock-racket-frame
        teaching_use: 只标记球拍经过头顶区域的时间窗口，不声称识别到精确触球帧。
        teaching_points:
          - 用前后连续帧理解球拍经过头顶区域的过程。
          - 精确触球、拍面和力量无法由该普通单目视频确认。
