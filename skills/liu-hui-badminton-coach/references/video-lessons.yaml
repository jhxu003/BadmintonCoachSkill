        phase: follow_through
        start_seconds: 578.57
        anchor_seconds: 578.73
        end_seconds: 579.00
        confidence: medium
        framework_ids:
          - static-lock-racket-frame
        teaching_use: 展示球拍通过头顶区域后动作仍连续向前，不把近似击球窗口当作终点。
        teaching_points:
          - 观察随挥、身体转回和下降落地如何连续发生。
        visible_facts:
