        phase: start
        start_seconds: 577.87
        anchor_seconds: 578.00
        end_seconds: 578.13
        confidence: high
        framework_ids:
          - static-lock-racket-frame
        teaching_use: 展示从等待状态进入起跳和举拍的连续启动，而不是直接跳到最高点。
        teaching_points:
          - 观察屈膝、身体下沉和球拍上举如何在同一段连续动作中开始。
        visible_facts:
          - knees_flex_and_center_of_mass_lowers
          - racket_arm_begins_upward_motion
        limitations:
          - force_and_muscle_activation_unknown
      - stage_id: rise
        label: 起跳举拍形成头顶击球结构
        phase: top_elbow
        start_seconds: 578.13
        anchor_seconds: 578.33
        end_seconds: 578.43
        confidence: medium
        framework_ids:
          - static-lock-racket-frame
        teaching_use: 用于观察腾空时持拍臂已举过肩部的可见结构，不推断精确关节角度。
        teaching_points:
          - 结合前后短片观察举拍过程，不要只模仿这一张定格。
        visible_facts:
          - both_feet_leave_floor
          - racket_arm_is_raised_above_shoulder_level
          - racket_and_hitting_arm_remain_inside_frame
        limitations:
