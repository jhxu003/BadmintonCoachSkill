version: 1
scope_boundary_zh: >-
  路由只确定公开视频片段所讲的受控技术主题，并且只接纳可见的完整或部分协调动作。
  普通单目画面不能证明精确触球、拍面角度、握拍压力、力量大小、真实内旋、三维运动学或对手意图。
  握拍比划、静态讲解、纯战术口述和装备内容不能发布为连续动作教学包。
