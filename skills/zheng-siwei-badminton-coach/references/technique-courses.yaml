          anchor_status: not_preserved
          anchor_seconds: null
          cue_zh: 定位球拍经过头顶预期击球区域的可见窗口。
          visible_evidence_zh: 球拍处于本次突击的快速通过区域，身体仍在动作链中。
          limitation_zh: 不声称精确触球、拍面、球速、力量或落点。
        - sequence: 6
          stage_id: landing
          stage_role: follow_through
