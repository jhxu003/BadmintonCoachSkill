    title_en: Low backhand transition from movement to recovery
    learning_goal_zh: 在固定全身机位中理解单次反手低手位移动、跨步、加载、近似处理窗口、随挥和回收，不将一次对角示范推广为所有来球的固定选择。
    level: [beginner, intermediate, competitive]
    prerequisites: [能在安全场地完成低速反手侧移动和跨步；训练中另行提供来球与线路条件。]
    core_principles:
      - principle_id: full-route-low-transition
        title_zh: 低手位也要看完整路线
        cue_zh: 从固定机位中的准备开始，将移动、跨步、低手位处理和恢复作为同一次动作看。
        evidence_boundary_zh: 片段不证明来球落点、精确移动距离或唯一脚序。
      - principle_id: preserve-choice-after-defense
        title_zh: 处理后保留下一次选择
        cue_zh: 低手位通过后继续恢复到可移动状态，再在有条件的练习中连接中性或进攻过渡。
        evidence_boundary_zh: 普通单目视频不能证明精确触球、拍面、旋转、力量或战术意图。
    common_errors:
      - rule_id: zsw-defense-spacing-collapsed
        summary_zh: 低手位处理时身体和可用空间同时被压缩。
        correction_zh: 先恢复跨步支撑和可见处理路线，再增加来球速度或随机性。
      - rule_id: zsw-no-transition-after-time-gained
        summary_zh: 处理完成后没有回到可选择的过渡状态。
        correction_zh: 把随挥后的回收与下一球口令加入每次练习。
