    level: [beginner, intermediate, competitive]
    prerequisites: [训练前先明确本次接发条件与下一球覆盖人。]
    core_principles:
      - principle_id: route-with-owner
        title_zh: 接发路线要有下一拍归属
        cue_zh: 接发前后都说清本侧和搭档的下一球覆盖线路，不把角色按性别或固定位置硬编码。
        evidence_boundary_zh: 片段只展示教练的单人路线，不能直接证明搭档分工或对手意图。
      - principle_id: continue-after-window
        title_zh: 处理后继续移动
        cue_zh: 将接近、近似处理窗口和随后的继续移动连起来，不把接发当成一拍结束。
        evidence_boundary_zh: 普通视频不能测量精确触球、拍面、球速或场地距离。
    common_errors:
      - rule_id: zsw-passive-receive-route
        summary_zh: 接发后没有形成下一次主动交换。
        correction_zh: 将接发路线与第二次交换的覆盖人一起口令化练习。
      - rule_id: zsw-opening-role-unclear
        summary_zh: 两人对下一拍归属不清楚。
        correction_zh: 在发球前用与线路绑定的短口令明确互补覆盖。
    framework_ids: [zsw-receive-opening-exchange, zsw-pair-rotation-two-lanes]
    drill_ids: [zsw-receive-two-exchange, zsw-two-lane-rotation-call]
    retest_metrics: [随机开局中至少 8/10 次在处理前后都能清楚说出下一条覆盖线路。]
