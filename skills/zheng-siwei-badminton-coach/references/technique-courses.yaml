          anchor_status: not_preserved
          anchor_seconds: null
          cue_zh: 观察脚下怎样开始进入正手后场路线。
          visible_evidence_zh: 双脚和身体朝向相对准备状态开始改变。
          limitation_zh: 不能测量真实反应时间、步幅或地面反作用力。
        - sequence: 3
