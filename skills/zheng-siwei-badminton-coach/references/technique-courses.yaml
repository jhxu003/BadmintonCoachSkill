          image_path: pages-demo/zheng-siwei-rear-attack-footwork/keyframes/07-recovery.jpg
          anchor_status: not_preserved
          anchor_seconds: null
          cue_zh: 确认第一条喂球后重新建立可移动和可持拍的状态。
          visible_evidence_zh: 落地已经完成，身体和球拍进入下一拍准备。
          limitation_zh: 短片不证明完整比赛中的最佳回位或搭档分工。
