analysis:
  normalized_fps: 30
  max_width: 1280
  max_candidates_per_action_window: 7
  minimum_pose_confidence: 0.5
pose:
  provider: ultralytics
  model_path: yolo11n-pose.pt
  inference_stride: 2
multiplayer:
  provider: ultralytics_bytetrack
  pose_model_path: yolo11n-pose.pt
  inference_stride: 2
  inference_size: 1280
shuttle:
  provider: torchscript_temporal_heatmap
  model_path: ''
  input_width: 512
  input_height: 288
  temporal_frames: 4
  background_mode: concat
  confidence_threshold: 0.15
visual_review:
  provider: qwen_local
  model_path: Qwen/Qwen2.5-VL-3B-Instruct
  max_new_tokens: 256
  allowed_confidence: [low, medium, high]
agent:
  # Two local tiers run sequentially in the GPU worker: the routing tier is
  # released before the larger observer is loaded.
  router_provider: qwen_local
  router_model_path: Qwen/Qwen2.5-VL-3B-Instruct
  observer_provider: qwen_local
  observer_model_path: Qwen/Qwen2.5-VL-7B-Instruct
  route_confidence_threshold: 0.8
  max_units: 5
  # Bound visual tokens so routing/verification can share a single GPU.
  router_max_samples: 12
  observer_frames_per_phase: 1
boundaries:
  prohibited_claims:
    - true_internal_rotation
    - racket_face_angle
    - grip_pressure
    - exact_shuttle_contact
    - tactical_intent
    - force
    - calibrated_3d_biomechanics
